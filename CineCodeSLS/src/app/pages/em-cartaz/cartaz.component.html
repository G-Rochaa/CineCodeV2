<app-nav></app-nav>

<section class="em-breve">
    <h2>Em Cartaz</h2>
    <div class="movies">
        <div *ngFor="let filme of filmes" class="movie">
            <img src="{{filme.imagem}}" alt="Imagem do Filme">
            <div class="movie-info">
                <h3>{{ filme.titulo }}</h3>
                <p>{{filme.sinopse}}</p>
                <p> Classificação: {{filme.classificacao}}</p>
                <button class="btn btn-info" [routerLink]="['/filme', filme.id]">Ver Detalhes</button>           
             </div>
        </div>
    </div>
</section>
