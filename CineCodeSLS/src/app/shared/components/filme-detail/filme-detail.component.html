<div class="container mt-4" *ngIf="filme">
  <div class="row">
      <div class="col-md-4 d-flex flex-column align-items-start">
          <h2 class="text-left">{{ filme.titulo }}</h2>
          <img [src]="filme.imagem" alt="Imagem do Filme" class="img-fluid rounded mt-2" style="max-width: 250px;">
          <p class="mt-3"><strong>Sinopse:</strong> {{ filme.sinopse }}</p>
          <p><strong>Diretor:</strong> {{ filme.diretor }}</p>
          <p><strong>Ano de Lançamento:</strong> {{ filme.anoLancamento | date }}</p>
          <p><strong>Duração:</strong> {{ filme.duracao.hours }}h {{ filme.duracao.minutes }}m</p>
          <button class="btn btn-secondary mt-3" routerLink="/Home">Voltar a Home</button>
      </div>

      <div class="col-md-4 offset-md-2" style="top: 20px;">
          <div class="dropdown mb-3">
              <button class="btn btn-outline border-0 dropdown-toggle" type="button" id="dropdownData" data-bs-toggle="dropdown" aria-expanded="false">
                  {{ dataSelecionada ? dataSelecionada : 'Selecionar Data' }}
              </button>
              <ul class="dropdown-menu" aria-labelledby="dropdownData">
                  <li *ngFor="let dia of dias">
                      <a class="dropdown-item" (click)="selecionarData(dia)">{{ dia }}</a>
                  </li>
              </ul>
          </div>
      </div>
  </div>
</div>

<div class="container mt-4" *ngIf="!filme">
  <p>Filme não encontrado.</p>
</div>
